<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StudyFlow Focus Shield</title>
  <style>
    body { width: 280px; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; margin: 0; }
    h3 { margin-top: 0; color: #38bdf8; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.4); margin-bottom: 12px; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.4; }
    button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #4f46e5; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <h3>🛡️ Focus Shield Active</h3>
  <div class="status-badge">● Syncing with StudyFlow</div>
  <p>Enforcing distraction shielding. YouTube Study Mode & WhatsApp are permitted.</p>
  <button onclick="window.open('http://localhost:3000/#planner')">Open Strict Study Plan</button>
</body>
</html>
